# --------------------------------------------------
# Bluetooth
# --------------------------------------------------

CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_OBSERVER=y

CONFIG_BT_MAX_CONN=1

# GATT client
CONFIG_BT_GATT_CLIENT=y

# Bluetooth security support
CONFIG_BT_SMP=y


# --------------------------------------------------
# Logging
# --------------------------------------------------

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

CONFIG_PRINTK=y


# --------------------------------------------------
# Main stack
# --------------------------------------------------

CONFIG_MAIN_STACK_SIZE=4096